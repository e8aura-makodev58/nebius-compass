# ResponseCompass production deployment.
# Run with: docker compose -p responsecompass up -d --build
# The project name, container, volume and host port are all distinct from the
# older Compass deployment on this host (project "compass", volume "compass-data",
# port 3000); never point this file at that volume.
name: responsecompass

services:
  responsecompass:
    build:
      context: .
    image: responsecompass:latest
    container_name: responsecompass
    ports:
      # Host port and bind address from .env. On e8aura-deploy, COMPASS_BIND is the
      # Tailscale address so the app is reachable only over Tailscale until it goes public.
      - "${COMPASS_BIND:-0.0.0.0}:${COMPASS_HOST_PORT:-3200}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      COMPASS_HOST: 0.0.0.0
      COMPASS_PORT: "3000"
      COMPASS_DATA_DIR: /app/data
      # Host key paths in .env are not visible inside the container; each key is
      # mounted read-only as a Compose secret and read from here instead.
      NEBIUS_TOKEN_FACTORY_API_KEY_FILE: /run/secrets/nebius_token_factory_key
      AMD_TOKEN_FACTORY_API_KEY_FILE: /run/secrets/amd_token_factory_key
      # Copies the tracked paused demo seed only into an empty volume. It
      # never overwrites existing runtime state after a pull or restart.
      COMPASS_BOOTSTRAP_DEMO_SEED: "true"
    secrets:
      - nebius_token_factory_key
      - amd_token_factory_key
    volumes:
      - responsecompass-data:/app/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Cloudflare Tunnel to the app. Outbound-only: no host port is opened. Runs only with
  # the "tunnel" profile (COMPOSE_PROFILES=tunnel in .env), so the app still deploys on
  # its own. In the Cloudflare dashboard the public hostname's service must be
  # http://responsecompass:3000 (the app's name on this Compose network).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    container_name: responsecompass-tunnel
    profiles: ["tunnel"]
    # The host token file should be mode 600; a file secret is a bind mount that keeps the
    # host owner, so run as that owner (uid 1000 on m920) rather than the image's 65532.
    user: "1000:1000"
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/responsecompass_tunnel_token"]
    secrets:
      - responsecompass_tunnel_token
    depends_on:
      responsecompass:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  responsecompass_tunnel_token:
    # Host path of the tunnel token file, from RESPONSECOMPASS_TUNNEL_TOKEN_FILE in .env.
    file: ${RESPONSECOMPASS_TUNNEL_TOKEN_FILE:-./.tunnel-token-not-configured}
  nebius_token_factory_key:
    # Host path of the Nebius key file, taken from NEBIUS_TOKEN_FACTORY_API_KEY_FILE in .env.
    file: ${NEBIUS_TOKEN_FACTORY_API_KEY_FILE:?set NEBIUS_TOKEN_FACTORY_API_KEY_FILE in .env to the host key file}
  amd_token_factory_key:
    # Optional: AMD stays selectable in Settings. Without a key file the empty /dev/null
    # mount means "no key", so AMD calls fail closed and fall back.
    file: ${AMD_TOKEN_FACTORY_API_KEY_FILE:-/dev/null}

volumes:
  responsecompass-data:
    name: responsecompass-data
